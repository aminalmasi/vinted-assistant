name: taxonomy-probe
on:
  workflow_dispatch:
    inputs:
      module: { description: 'probe to run', default: 'assistant.brand_probe' }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - run: python -m ${{ inputs.module }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taxonomy
          retention-days: 3
          path: |
            *.json
            *.txt.gz
