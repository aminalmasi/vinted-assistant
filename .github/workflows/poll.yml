name: poll

# Fetches each requested watch's Vinted filter page and hands the listings back
# as an artifact. Triggered only by the cluster (workflow_dispatch) - GitHub's
# own scheduler creates just 4-6 runs a day whatever cron it is given, which
# would make a 15-minute cadence impossible.
#
# This repository is public, and so are its run logs, inputs and artifacts.
# Filter URLs come from the WATCH_FILTERS secret; what to poll arrives sealed
# in the `req` input and the results leave sealed, both with the WATCH_KEY
# secret (assistant/seal.py). Nothing readable here says what is being hunted.

on:
  workflow_dispatch:
    inputs:
      req:
        description: 'sealed request (assistant/seal.py); empty = poll all watches'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - name: Poll
        env:
          WATCH_FILTERS: ${{ secrets.WATCH_FILTERS }}
          WATCH_REQ: ${{ inputs.req }}
          VA_KEY: ${{ secrets.WATCH_KEY }}
        run: python -m assistant.poll
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.enc
          # The cluster downloads this within minutes; nothing needs it after.
          retention-days: 1
